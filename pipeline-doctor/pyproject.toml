[project]
name = "cursor-pipeline-doctor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["cursor-sdk==1.0.31"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
